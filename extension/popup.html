<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HushDown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd-header">
      <img src="icons/logo.png" alt="HushDown" class="hd-logo" width="36" height="36" />
      <div class="hd-header-text">
        <h1 class="hd-title">HushDown</h1>
        <p class="hd-sub">İndirmeleri sessizce zaman damgalı dosya adıyla kaydeder.</p>
      </div>
      <button type="button" id="helpBtn" class="hd-help-btn" title="Nasıl kullanılır">?</button>
    </header>

    <section class="hd-section">
      <div class="hd-actions hd-actions-single">
        <button type="button" id="openDownloads" class="hd-btn hd-btn-primary">
          İndirilenler klasörünü aç
        </button>
      </div>
    </section>

    <section class="hd-section">
      <h2 class="hd-heading">Son 10 indirme</h2>
      <ul id="log" class="hd-log"></ul>
      <p id="logEmpty" class="hd-empty">Henüz kayıt yok.</p>
      <a href="#" id="fullHistory" class="hd-full-history">Tam indirme geçmişi</a>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
