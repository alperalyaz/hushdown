<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HushDown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd-header">
      <img src="icons/logo.png" alt="HushDown" class="hd-logo" width="36" height="36" />
      <div class="hd-header-text">
        <h1 class="hd-title">HushDown</h1>
        <p class="hd-sub" id="versionLabel"></p>
      </div>
      <button type="button" id="helpBtn" class="hd-help-btn" data-i18n-title="helpBtnTitle">?</button>
    </header>

    <section class="hd-section">
      <h2 class="hd-heading" data-i18n="projectHeading"></h2>

      <div id="groupCard" class="hd-card hd-card-group" hidden>
        <p class="hd-card-text" id="groupText"></p>
      </div>

      <form id="startForm" class="hd-start">
        <input type="text" id="projectInput" class="hd-input" maxlength="60"
          autocomplete="off" data-i18n-placeholder="projectPlaceholder" />
        <button type="submit" class="hd-btn hd-btn-primary" data-i18n="projectStart"></button>
      </form>
      <div id="recentList" class="hd-chips"></div>
      <p id="idleHint" class="hd-hint" data-i18n="idleHint"></p>

      <div id="activeCard" class="hd-card" hidden>
        <div class="hd-card-top">
          <span class="hd-dot"></span>
          <span class="hd-card-title" id="activeName"></span>
        </div>
        <p class="hd-card-meta" id="activeMeta"></p>
        <p class="hd-card-example" id="activeExample"></p>
        <div id="permRow" class="hd-perm" hidden>
          <p class="hd-perm-text" data-i18n="permHint"></p>
          <button type="button" id="grantTabs" class="hd-btn hd-btn-sm hd-btn-primary" data-i18n="permGrant"></button>
        </div>
        <div class="hd-card-actions">
          <button type="button" id="showFolder" class="hd-btn hd-btn-sm" data-i18n="showFolder"></button>
          <button type="button" id="copySources" class="hd-btn hd-btn-sm" data-i18n="copySources"></button>
          <button type="button" id="stopProject" class="hd-btn hd-btn-sm hd-btn-ghost" data-i18n="projectStop"></button>
        </div>
      </div>
    </section>

    <section class="hd-section hd-settings-section">
      <label class="hd-toggle-row">
        <input type="checkbox" id="useTabGroups" />
        <span class="hd-switch"></span>
        <span class="hd-toggle-label" data-i18n="useTabGroupsLabel"></span>
      </label>
      <label class="hd-toggle-row">
        <input type="checkbox" id="notifications" />
        <span class="hd-switch"></span>
        <span class="hd-toggle-label" data-i18n="notificationsLabel"></span>
      </label>
    </section>

    <section class="hd-section">
      <div class="hd-log-header">
        <h2 class="hd-heading" data-i18n="historyHeading"></h2>
        <button type="button" id="openDownloads" class="hd-btn hd-btn-sm"
          data-i18n="openFolderLabel" data-i18n-title="openFolderTitle"></button>
      </div>
      <div class="hd-search-wrap">
        <svg class="hd-search-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="searchInput" class="hd-search"
          data-i18n-placeholder="searchPlaceholder" />
      </div>
      <ul id="log" class="hd-log"></ul>
      <p id="logEmpty" class="hd-empty" data-i18n="logEmptyText"></p>
      <a href="#" id="fullHistory" class="hd-full-history" data-i18n="fullHistoryLabel"></a>
    </section>

    <div id="toast" class="hd-toast" hidden></div>

    <script src="naming.js"></script>
    <script src="sources.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
