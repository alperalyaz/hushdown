<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HushDown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd-header">
      <img src="icons/logo.png" alt="HushDown" class="hd-logo" width="36" height="36" />
      <div class="hd-header-text">
        <h1 class="hd-title">HushDown</h1>
        <p class="hd-sub" data-i18n="headerSub"></p>
      </div>
      <button type="button" id="helpBtn" class="hd-help-btn" data-i18n-title="helpBtnTitle">?</button>
    </header>

    <section class="hd-section hd-settings-section">
      <fieldset class="hd-settings">
        <legend class="hd-settings-label" data-i18n="filenameModeLabel"></legend>
        <label class="hd-radio">
          <input type="radio" name="filenameMode" value="timestamp" checked />
          <span data-i18n="filenameModeTimestamp"></span>
        </label>
        <label class="hd-radio">
          <input type="radio" name="filenameMode" value="timestamp-original" />
          <span data-i18n="filenameModeTimestampOriginal"></span>
        </label>
      </fieldset>
    </section>

    <section class="hd-section">
      <div class="hd-log-header">
        <h2 class="hd-heading" data-i18n="last10Heading"></h2>
        <button type="button" id="openDownloads" class="hd-btn hd-btn-sm"
          data-i18n="openFolderLabel" data-i18n-title="openFolderTitle"></button>
      </div>
      <ul id="log" class="hd-log"></ul>
      <p id="logEmpty" class="hd-empty" data-i18n="logEmptyText"></p>
      <a href="#" id="fullHistory" class="hd-full-history" data-i18n="fullHistoryLabel"></a>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
