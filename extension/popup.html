<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HushDown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hd-header">
      <img src="icons/logo.png" alt="HushDown" class="hd-logo" width="36" height="36" />
      <div class="hd-header-text">
        <h1 class="hd-title">HushDown</h1>
        <p class="hd-sub" id="versionLabel"></p>
      </div>
      <button type="button" id="helpBtn" class="hd-help-btn" data-i18n-title="helpBtnTitle">?</button>
    </header>

    <section class="hd-section hd-settings-section">
      <fieldset class="hd-settings">
        <legend class="hd-settings-label" data-i18n="filenameModeLabel"></legend>
        <div class="hd-pill-group">
          <label class="hd-pill">
            <input type="radio" name="filenameMode" value="timestamp" checked />
            <span data-i18n="filenameModeTimestamp"></span>
          </label>
          <label class="hd-pill">
            <input type="radio" name="filenameMode" value="timestamp-original" />
            <span data-i18n="filenameModeTimestampOriginal"></span>
          </label>
          <label class="hd-pill">
            <input type="radio" name="filenameMode" value="original" />
            <span data-i18n="filenameModeOriginal"></span>
          </label>
        </div>
      </fieldset>
      <div class="hd-divider"></div>
      <label class="hd-toggle-row">
        <input type="checkbox" id="folderOrganization" />
        <span class="hd-switch"></span>
        <span class="hd-toggle-label" data-i18n="folderOrganizationLabel"></span>
      </label>
    </section>

    <section class="hd-section">
      <div class="hd-log-header">
        <h2 class="hd-heading" data-i18n="historyHeading"></h2>
        <button type="button" id="openDownloads" class="hd-btn hd-btn-sm"
          data-i18n="openFolderLabel" data-i18n-title="openFolderTitle"></button>
      </div>
      <div class="hd-search-wrap">
        <svg class="hd-search-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="searchInput" class="hd-search"
          data-i18n-placeholder="searchPlaceholder" />
      </div>
      <ul id="log" class="hd-log"></ul>
      <p id="logEmpty" class="hd-empty" data-i18n="logEmptyText"></p>
      <a href="#" id="fullHistory" class="hd-full-history" data-i18n="fullHistoryLabel"></a>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
